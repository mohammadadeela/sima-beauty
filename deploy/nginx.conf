# Nginx site for Sima Beauty.
# 1. Replace your-domain.com (two places) with the real domain.
# 2. Save as /etc/nginx/sites-available/sima and link it into sites-enabled.
# 3. Run certbot to add HTTPS (see README).

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    client_max_body_size 15M;        # product photo uploads

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
